version: '3.8'

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: sumo-server
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - dokploy-network

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_GOOGLE_CLIENT_SECRET: ${VITE_GOOGLE_CLIENT_SECRET:-}
        VITE_RPC_URL: ${VITE_RPC_URL:-}
    container_name: sumo-web
    restart: unless-stopped
    depends_on:
      - server
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
